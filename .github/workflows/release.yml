name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and upload to extensions.gnome.org
        id: pkg
        uses: murar8/gnome-extensions-action@0.1.1
        with:
          username: NB-Group
          password: ${{ secrets.GNOME_PASSWORD }}
          accept-tos: true

      - name: Attach the zip to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.zip-file }}" \
            --title "${GITHUB_REF_NAME}" --generate-notes
