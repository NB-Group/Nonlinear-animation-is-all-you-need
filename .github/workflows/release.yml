name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the extension zip
        run: |
          sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin gettext
          ./build.sh

      - name: Attach the zip to the tag's GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub side only. Uploading to extensions.gnome.org stays a
          # manual, deliberate step for the maintainer; an expired EGO
          # password must never fail a release, and no tag push should
          # ever submit to EGO on its own.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            nonlinear-animation@nbgroup.zip --clobber
