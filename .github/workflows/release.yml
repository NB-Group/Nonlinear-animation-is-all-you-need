name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install glib-compile-schemas
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin

      - name: Build zip
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create GitHub release with the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" nonlinear-animation@nbgroup.zip \
            --title "${GITHUB_REF_NAME}" --generate-notes
