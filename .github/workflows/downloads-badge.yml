name: Downloads badge

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll EGO and write the shields endpoint JSON
        run: |
          count=$(curl -sf --max-time 30 \
            "https://extensions.gnome.org/extension-info/?uuid=nonlinear-animation@nbgroup" \
            | jq -r '.downloads') || count=""
          [ -z "$count" ] && { echo "poll failed, keeping the old badge"; exit 0; }
          jq -n --arg c "$count" '{
            schemaVersion: 1,
            label: "downloads",
            message: $c,
            color: "brightgreen"
          }' > data/badge.json
          cat data/badge.json

      - name: Commit if the badge changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/badge.json
          git diff --cached --quiet || git commit -m "chore: refresh downloads badge"
          git push
