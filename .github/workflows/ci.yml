name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata.json
        run: |
          jq -e 'has("uuid") and has("name") and has("shell-version") and has("settings-schema")' metadata.json

      - name: Install glib-compile-schemas
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev-bin

      - name: Build zip
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nonlinear-animation@nbgroup
          path: nonlinear-animation@nbgroup.zip
